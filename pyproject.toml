[project]
name = "fitlife"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = ["openai==3.20.0", "mcp==1.30.0", "jsonschema==4.26.0", "pydantic==2.14.2", "pydantic-settings==2.16.2", "SQLAlchemy==2.0.55", "alembic==1.20.1", "PyMySQL==1.2.3", "fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1", "redis==8.1.0", "python-dotenv==1.2.4", "tzdata==2026.6", "pywin32==312; sys_platform == 'win32'"]

[project.optional-dependencies]
media = ["mediapipe==1.2.3", "numpy==2.5.4", "opencv-contrib-python==5.0.0.93"]
media-eval = ["pylance==14.0.3", "pyarrow==26.0.1"]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1", "pytest-cov==7.1.0", "ruff==0.17.3", "websockets==17.4"]

[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fitlife"]

[tool.setuptools.package-data]
fitlife = ["web/*.html", "web/*.js", "web/*.css"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["fitlife"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses fitlife_test and synthetic users only"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"


